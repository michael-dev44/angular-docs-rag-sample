name: Deploy Angular App to EC2 with Nginx

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 3️⃣ Install dependencies and build Angular app
      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (production)
        run: npm run build -- --configuration production

      # 4️⃣ Setup SSH key
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "echo 'SSH OK'"

      # 5️⃣ Add EC2 host to known_hosts
      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 6️⃣ Install Nginx on EC2 and deploy files
      - name: Deploy to EC2
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            # Update and install Nginx
            sudo apt update
            sudo apt install -y nginx

            # Stop default Nginx site (optional)
            sudo rm -rf /var/www/html/*

            # Ensure directory exists
            sudo mkdir -p /var/www/html

          EOF

      - name: Copy Angular dist files to EC2
        run: |
          # Copy Angular dist files to EC2
          rsync -avz dist/* ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/dist/

      - name: Move files to Nginx root and configure
        run: |
          # Move files to Nginx root and configure
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            sudo cp -r /home/ubuntu/dist/* /var/www/html/
            
            # Configure Nginx for Angular SPA
            sudo tee /etc/nginx/sites-available/default > /dev/null <<'NGINX_CONF'
            server {
                listen 80;
                server_name _;

                root /var/www/html;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX_CONF

            # Test and restart Nginx
            sudo nginx -t
            sudo systemctl restart nginx
          EOF
