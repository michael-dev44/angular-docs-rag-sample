name: Deploy Node App to EC2 via CodeDeploy

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create deployment bundle
        run: |
          mkdir -p codedeploy
          cp -r * codedeploy/
          cp appspec.yml codedeploy/appspec.yml
          cd codedeploy && zip -r ../deploy_bundle.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload bundle to S3
        run: aws s3 cp deploy_bundle.zip s3://${{ secrets.S3_BUCKET }}/deploy_bundle.zip

      - name: Create deployment
        run: |
          aws deploy create-deployment \
            --application-name "${{ secrets.CODEDEPLOY_APP }}" \
            --deployment-group-name "${{ secrets.CODEDEPLOY_GROUP }}" \
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=deploy_bundle.zip,bundleType=zip
            --description "Deployment from GitHub Actions"
