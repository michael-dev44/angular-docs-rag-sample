name: Deploy Angular App to EC2 with Nginx

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3️⃣ Cache dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5️⃣ Build Angular app
      - name: Build Angular app
        run: npm run build -- --configuration production

      # 6️⃣ Setup SSH key
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # 7️⃣ Add EC2 host to known_hosts
      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 8️⃣ Test SSH connection
      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o BatchMode=yes ubuntu@${{ secrets.EC2_HOST }} "echo 'SSH OK'"

      # 9️⃣ Install Nginx and prepare directories
      - name: Prepare EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            sudo apt update
            sudo apt install -y nginx
            sudo rm -rf /var/www/html/*
            sudo mkdir -p /var/www/html
            sudo mkdir -p /home/ubuntu/dist
          EOF

      # 🔟 Upload Angular build
      - name: Copy Angular dist files to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            dist/angular-chatbot/browser/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/dist/

      # 1️⃣1️⃣ Move files to Nginx root and configure
      - name: Move files and restart Nginx
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            sudo cp -r /home/ubuntu/dist/* /var/www/html/

            sudo tee /etc/nginx/sites-available/default > /dev/null <<'NGINX_CONF'
            server {
                listen 80;
                server_name _;
                root /var/www/html;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX_CONF

            sudo nginx -t
            sudo systemctl restart nginx
          EOF
